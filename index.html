</style></head><body><div id="app"></div><script>
'use strict';const ROOT=document.getElementById('app');const USER_KEY='agrogestor-demo-users-email-v04';const SESSION_KEY='agrogestor-demo-session-email-v04';let current=localStorage.getItem(SESSION_KEY)||'',selectedArea='',selectedTab='resumo',sharedPage=false,authMode='login';const empty=()=>({areas:[],seasons:[],lots:[],applications:[],harvests:[],sales:[],costs:[],equipment:[],equipmentUsage:[],products:[],laborRates:[]});let db=empty();const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||String(Date.now()+Math.random());const money=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),num=v=>(+v||0).toLocaleString('pt-BR',{maximumFractionDigits:2});const packInfo=p=>{const qty=Number(p.packQty)||1;const pu=p.packUnit||p.unit;const factor=pu==='L'?1000:pu==='kg'?1000:1;return {qty,pu,baseQty:qty*factor}};const users=()=>JSON.parse(localStorage.getItem(USER_KEY)||'{}');const dataKey=()=>`agrogestor-demo-data-email-v04-${current}`;const save=()=>{localStorage.setItem(dataKey(),JSON.stringify(db));render()};const formData=e=>Object.fromEntries(new FormData(e.target));const today=()=>new Date().toISOString().slice(0,10);const section=(title,body)=>`<section class="card section"><h3>${title}</h3>${body}</section>`;const table=(headers,rows)=>`<div class="table-scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">Nenhum lançamento registrado.</td></tr>`}</tbody></table></div>`;const tr=(...v)=>`<tr>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`;const del=(kind,id)=>`<button type="button" class="outline" data-delete="${kind}" data-id="${esc(id)}" title="Excluir lançamento" style="padding:6px 10px;color:#b91c1c;border-color:#fca5a5">Excluir</button>`;const field=(label,name,type='text',extra='required')=>`<div><label>${label}</label><input name="${name}" type="${type}" ${extra}></div>`;const options=(arr,fn)=>arr.map(x=>`<option value="${esc(x.id)}">${esc(fn(x))}</option>`).join('');const notice='<div class="notice">Versão demonstrativa: e-mail e senha são usados somente para testar a navegação neste navegador. Não use senhas reais. Este login local não oferece autenticação segura nem sincronização; a versão definitiva exigirá servidor e banco de dados protegido.</div>';
function layout(content,publicPage=false){const user=users()[current];ROOT.innerHTML=`<div class="shell"><header class="top"><div class="brand">🌿 AgroGestor Frutícola</div><div class="actions">${publicPage?'<button class="ghost" data-go="login">Entrar</button><button data-go="cadastro">Criar conta</button>':`<span class="small muted">${esc(user?.name||'Usuário')}</span><button class="outline" data-go="sair">Sair</button>`}</div></header>${content}<footer class="foot">AgroGestor Frutícola · Protótipo v0.9 · Dados locais, sem nuvem · Não substitui contabilidade ou registros agronômicos oficiais</footer></div>`}
function landing(){layout(`<div class="hero"><div class="eyebrow">Gestão inteligente da fruticultura</div><h1>Da primeira aplicação ao lucro de cada quilo colhido.</h1><p>Organize suas áreas, acompanhe safras, registre compras, consumo de insumos, colheitas e vendas. Descubra o custo de produção e o resultado de cada talhão em um só lugar.</p><div class="actions"><button data-go="cadastro">Começar agora →</button><button class="ghost" data-go="login">Já tenho cadastro</button></div></div><div class="features"><div class="card"><div class="feature-icon">🌳</div><h3>Áreas e safras</h3><p class="muted">Controle cada pomar e compare os ciclos de produção.</p></div><div class="card"><div class="feature-icon">🧴</div><h3>Insumos e estoque</h3><p class="muted">Registre as compras e atribua o custo apenas quando utilizar o produto.</p></div><div class="card"><div class="feature-icon">📈</div><h3>Rentabilidade</h3><p class="muted">Acompanhe produção, custo por quilo e resultados das vendas.</p></div></div><div style="margin-top:22px">${notice}</div>`,true)}

function load(){try{db={...empty(),...JSON.parse(localStorage.getItem(dataKey())||'{}')}}catch{db=empty()}}
function dashboard(){const cards=db.areas.map(a=>{const ss=db.seasons.filter(s=>s.area===a.id);return `<button class="area" data-area="${esc(a.id)}"><div class="chip">${esc(a.crop)}</div><h3 style="margin-top:15px">${esc(a.name)}</h3><div class="muted small">${esc(a.variety||'Variedade não informada')} · ${num(a.ha)} ha</div><div class="muted small" style="margin-top:12px">${ss.length} safra(s) cadastrada(s) →</div></button><div style="margin-top:8px">${del('area',a.id)}</div>`}).join('');layout(`<div class="toolbar"><div><div class="eyebrow">Painel principal</div><h2 style="margin:4px 0">Minhas áreas produtivas</h2><p class="muted">Selecione um talhão para visualizar suas informações e registrar atividades.</p></div><div class="actions"><button class="outline" data-go="cadastros">📦 Insumos e mão de obra</button><button data-go="nova-area">+ Cadastrar área</button></div></div>${db.areas.length?`<div class="cards">${cards}</div>`:`<div class="empty"><h3>Você ainda não cadastrou nenhuma área</h3><p class="muted">Comece cadastrando seu primeiro pomar ou talhão.</p><button data-go="nova-area">Cadastrar primeira área</button></div>`}<div class="toolbar"><div class="muted small">${db.areas.length} área(s) cadastrada(s)</div><div class="actions"><button class="outline" id="importBackup">Importar backup JSON</button><button class="outline" id="backup">Exportar backup JSON</button><input type="file" id="backupFile" accept="application/json,.json" class="hide"></div></div>${notice}`)}
function sharedCatalog(){
 const products=db.products||[], rates=db.laborRates||[], lots=db.lots||[];
 const productRows=products.map(p=>{
  const pl=lots.filter(l=>l.productId===p.id||(!l.productId&&l.product===p.name));

  const value=pl.reduce((v,l)=>v+(+l.remaining||0)*(+l.unitCost||0),0);
  return tr(esc(p.name),esc(p.category),num(packInfo(p).qty)+' '+esc(packInfo(p).pu),num(qty)+' '+esc(p.unit),money(value),qty?money(value/qty):'Sem estoque',del('product',p.id));
 });
 const lotRows=lots.map(l=>tr(esc(l.date||'Não informada'),esc(l.product),(l.packages?num(l.packages)+' embalagem(ns) × '+num(l.packQty)+' '+esc(l.packUnit)+' = ':'')+num(l.qty)+' '+esc(l.unit),money(l.amount),money(l.unitCost)+'/'+esc(l.unit),num(l.remaining)+' '+esc(l.unit),del('lot',l.id)));

 const productsTable=section('Produtos e valores do estoque',table(['Produto','Categoria','Embalagem','Saldo','Valor do estoque','Custo médio / unidade','Ações'],productRows));
 const lotsTable=section('Histórico de compras / lotes',table(['Data','Produto','Quantidade comprada','Valor pago','Custo unitário','Saldo disponível','Ações'],lotRows));
 const laborTable=section('Mão de obra cadastrada',table(['Trabalhador / serviço','Valor da diária','Ações'],laborRows));
 const guidance=section('Como funciona','<p class="muted">Após registrar a compra, vá até uma área, abra a safra e registre a aplicação. Selecione o lote e informe a quantidade utilizada em ml, g ou unidades. A conversão da embalagem é automática. O sistema calcula o custo automaticamente e desconta do estoque.</p>');
 layout(`<div class="toolbar"><button class="ghost" data-go="painel">← Voltar às áreas</button></div>
 <h2>Produtos, compras e mão de obra</h2><p class="muted">Os produtos são compartilhados entre todas as áreas. Cadastre a quantidade por embalagem e informe quantas embalagens comprou. O preço é registrado em cada compra.</p>
 <div class="cards"><div class="card"><h3>1. Cadastrar produto</h3><form id="productForm"><div class="form-grid">

 ${field('Quantidade em cada embalagem','packQty','number','required min="0.000001" step="any" value="1"')}</div><p class="muted small">Exemplo: produto de 1 litro → unidade L e quantidade 1. Na compra, informe quantas embalagens adquiriu.</p>

}

function newArea(){layout(`<div class="toolbar"><button class="ghost" data-go="painel">← Voltar às áreas</button></div><div class="card" style="max-width:700px"><h2>Cadastrar nova área</h2><p class="muted">Cada área poderá ter várias safras, sem perder o histórico.</p><form id="areaForm"><div class="form-grid">${field('Nome da área','name','text','required placeholder="Talhão 1"')}${field('Cultura','crop','text','required placeholder="Uva, maçã, pêssego..."')}${field('Variedade','variety','text','placeholder="Isabel, Gala..."')}${field('Área em hectares','ha','number','required min="0.001" step="any"')}${field('Quantidade de plantas','plants','number','min="0" step="1"')}${field('Espaçamento entre linhas (m)','rowSpacing','number','min="0" step="any"')}${field('Espaçamento entre plantas (m)','plantSpacing','number','min="0" step="any"')}${field('Porta-enxerto','rootstock','text','placeholder="Opcional"')}${field('Ano de plantio','plantYear','number','min="1900" max="2100" step="1"')}</div><div class="form-actions"><button>Salvar área</button></div></form></div>`)}
function summary(s){const sum=(arr,key)=>arr.filter(x=>x.season===s.id).reduce((v,x)=>v+(+x[key]||0),0);const kg=sum(db.harvests,'kg'),sold=sum(db.sales,'kg'),cost=sum(db.applications,'amount')+sum(db.costs,'amount'),revenue=sum(db.sales,'amount'),ck=kg?cost/kg:null,profit=ck===null||sold>kg?null:revenue-ck*sold;return {kg,sold,cost,revenue,ck,profit,remaining:kg-sold}}
function areaPage(){const a=db.areas.find(x=>x.id===selectedArea);if(!a){selectedArea='';return dashboard()}const ss=db.seasons.filter(x=>x.area===a.id),active=ss.at(-1),s=active&&summary(active);const tabs=[['resumo','Visão geral'],['safras','Safras'],['aplicacoes','Aplicações'],['colheitas','Colheitas'],['vendas','Vendas'],['custos','Outros custos'],['estoque','Compras / estoque']];let body='';const seasonSelect=options(ss,x=>x.label);const seasonField=`<div><label>Safra</label><select name="season" required>${seasonSelect}</select></div>`;
if(selectedTab==='resumo'){body=`<div class="metrics">${[['Área',num(a.ha)+' ha'],['Plantas',num(a.plants||0)],['Safras',ss.length],['Colhido (última safra)',s?num(s.kg)+' kg':'—'],['Custo/kg colhido',s?.ck!=null?money(s.ck):'—'],['Receita das vendas',s?money(s.revenue):'—'],['Lucro estimado vendido',s?.profit!=null?money(s.profit):'—']].map(([k,v])=>`<div class="card metric"><span class="muted small">${k}</span><b>${v}</b></div>`).join('')}</div>${section('Dados do pomar',`<div class="form-grid"><div><b>Porta-enxerto</b><p>${esc(a.rootstock||'Não informado')}</p></div><div><b>Plantio</b><p>${esc(a.plantYear||'Não informado')}</p></div><div><b>Espaçamento</b><p>${a.rowSpacing&&a.plantSpacing?num(a.rowSpacing)+' × '+num(a.plantSpacing)+' m':'Não informado'}</p></div><div><b>Plantas/ha</b><p>${a.ha?num((a.plants||0)/a.ha):'—'}</p></div></div>`)}${section('Comparação entre safras',ss.length?ss.map(x=>{const r=summary(x);const max=Math.max(1,...ss.map(y=>summary(y).kg));return `<div class="statline"><span>${esc(x.label)}</span><b>${num(r.kg)} kg · ${r.ck===null?'sem custo/kg':money(r.ck)+'/kg'}</b></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,r.kg/max*100))}%"></span></div>`}).join(''):'<p class="muted">Cadastre safras para comparar a produtividade.</p>')}${section('Como começar','<p class="muted">1. Cadastre uma safra nesta área. 2. Cadastre compras no estoque. 3. Registre aplicações, colheitas, vendas e demais custos vinculados à safra. O resumo será atualizado automaticamente.</p>')}`}
if(selectedTab==='safras')body=section('Nova safra',`<form id="seasonForm"><div class="form-grid">${field('Identificação da safra','label','text','required placeholder="2026/2027"')}</div><div class="form-actions"><button>Cadastrar safra</button></div></form>`)+section('Safras da área',table(['Safra','Colhido','Custo total','Receita','Ações'],ss.map(x=>{const r=summary(x);return tr(esc(x.label),num(r.kg)+' kg',money(r.cost),money(r.revenue),del('season',x.id))})));
if(selectedTab==='estoque')body=section('Registrar compra de insumo',`<p class="muted small">O estoque é compartilhado entre todas as áreas. Você também pode registrar compras em Insumos e mão de obra, no painel principal.</p><form id="buyForm"><div class="form-grid"><div><label>Produto cadastrado</label><select name="productId" required>${options(db.products||[],x=>x.name+' ('+x.unit+')')}</select></div>${field('Quantidade de embalagens compradas','qty','number','required min="0.001" step="any"')}${field('Valor total da compra (R$)','amount','number','required min="0" step="0.01"')}</div><div class="form-actions"><button>Registrar compra</button></div></form>`)+section('Estoque disponível',table(['Produto','Saldo','Custo por unidade'],db.lots.map(x=>tr(esc(x.product),num(x.remaining)+' '+esc(x.unit),money(x.unitCost)))));
if(selectedTab==='aplicacoes')body=section('Registrar aplicação',`<form id="applyForm"><div class="form-grid">${seasonField}<div><label>Produto / lote</label><select name="lot" required>${options(db.lots.filter(x=>x.remaining>0),x=>x.product+' — '+num(x.remaining)+' '+x.unit)}</select></div>${field('Quantidade aplicada (unidade do lote)','qty','number','required min="0.001" step="any"')}${field('Data','date','date',`required value="${today()}"`)}${field('Observações','notes','text','placeholder="Aplicação no pomar"')}</div><div class="form-actions"><button ${!ss.length?'disabled':''}>Registrar aplicação</button></div></form>`)+section('Aplicações desta área',table(['Safra','Produto','Quantidade','Custo','Ações'],db.applications.filter(x=>ss.some(s=>s.id===x.season)).map(x=>tr(esc(ss.find(s=>s.id===x.season)?.label),esc(x.product),num(x.qty)+' '+esc(x.unit),money(x.amount),del('application',x.id)))));
if(selectedTab==='colheitas')body=section('Registrar colheita',`<form id="harvestForm"><div class="form-grid">${seasonField}${field('Data','date','date',`required value="${today()}"`)}${field('Peso colhido (kg)','kg','number','required min="0.001" step="any"')}</div><div class="form-actions"><button ${!ss.length?'disabled':''}>Registrar colheita</button></div></form>`)+section('Histórico de colheitas',table(['Safra','Data','Quantidade','Ações'],db.harvests.filter(x=>ss.some(s=>s.id===x.season)).map(x=>tr(esc(ss.find(s=>s.id===x.season)?.label),esc(x.date),num(x.kg)+' kg',del('harvest',x.id)))));
if(selectedTab==='vendas')body=section('Registrar venda',`<form id="saleForm"><div class="form-grid">${seasonField}${field('Data','date','date',`required value="${today()}"`)}${field('Quantidade vendida (kg)','kg','number','required min="0.001" step="any"')}${field('Preço por kg (R$)','price','number','required min="0" step="0.01"')}</div><div class="form-actions"><button ${!ss.length?'disabled':''}>Registrar venda</button></div></form>`)+section('Histórico de vendas',table(['Safra','Quantidade','Receita','Ações'],db.sales.filter(x=>ss.some(s=>s.id===x.season)).map(x=>tr(esc(ss.find(s=>s.id===x.season)?.label),num(x.kg)+' kg',money(x.amount),del('sale',x.id)))));
if(selectedTab==='custos')body=section('Mão de obra cadastrada',`<form id="laborUseForm"><div class="form-grid">${seasonField}<div><label>Trabalhador / serviço</label><select name="laborId" required>${options(db.laborRates||[],x=>x.name+' — '+(x.daily==null?'Revisar cadastro antigo':money(x.daily)+'/dia'))}</select></div>${field('Fração da diária (1 = dia inteiro; 0,5 = meio dia)','dayFraction','number','required min="0.01" max="1" step="0.01"')}${field('Data','date','date',`required value="${today()}"`)}</div><div class="form-actions"><button ${!ss.length?'disabled':''}>Lançar mão de obra</button></div></form>`)+section('Registrar custo de produção',`<form id="costForm"><div class="form-grid">${seasonField}${field('Descrição','description')}<div><label>Categoria</label><select name="category"><option>Mão de obra</option><option>Máquinas</option><option>Adubação</option><option>Irrigação</option><option>Outros</option></select></div>${field('Valor (R$)','amount','number','required min="0" step="0.01"')}</div><div class="form-actions"><button ${!ss.length?'disabled':''}>Registrar custo</button></div></form>`)+section('Histórico de custos',table(['Safra','Descrição','Categoria','Valor','Ações'],db.costs.filter(x=>ss.some(s=>s.id===x.season)).map(x=>tr(esc(ss.find(s=>s.id===x.season)?.label),esc(x.description),esc(x.category),money(x.amount),del('cost',x.id)))));
layout(`<div class="toolbar"><button class="ghost" data-go="painel">← Minhas áreas</button><span class="chip">${esc(a.crop)}</span></div><h2 style="margin-bottom:4px">${esc(a.name)}</h2><p class="muted">${esc(a.variety||'Variedade não informada')} · ${num(a.ha)} ha · ${ss.length} safra(s)</p><div class="tabs">${tabs.map(([id,label])=>`<button class="${selectedTab===id?'':'ghost'}" data-tab="${id}">${label}</button>`).join('')}</div>${body}<p class="small muted" style="margin-top:22px">Custo/kg = custos registrados ÷ kg colhidos. Lucro estimado sobre o vendido = receita − custo médio atribuído aos kg vendidos. Não inclui custos não cadastrados nem substitui apuração contábil.</p>`)}
function render(){if(!current||!users()[current]){current='';return location.hash==='#cadastro'?(authMode='cadastro',auth()):location.hash==='#login'?(authMode='login',auth()):landing()}load();if(selectedArea)return areaPage();return location.hash==='#cadastros'?sharedCatalog():location.hash==='#nova-area'?newArea():dashboard()}
async function hashPassword(password,salt){const data=new TextEncoder().encode(salt+':'+password);const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)&&e.length<=254}
function removeRecord(kind,id){
 const lists={area:'areas',season:'seasons',product:'products',lot:'lots',labor:'laborRates',application:'applications',harvest:'harvests',sale:'sales',cost:'costs'};
 const key=lists[kind];if(!key)return;
 const item=db[key].find(x=>x.id===id);if(!item)return;
 if(kind==='area'&&db.seasons.some(x=>x.area===id))throw Error('Esta área possui safras. Exclua os lançamentos e as safras antes de excluir a área.');
 if(kind==='season'&&['applications','harvests','sales','costs'].some(k=>db[k].some(x=>x.season===id)))throw Error('Esta safra possui lançamentos. Exclua-os primeiro.');
 if(kind==='product'&&db.lots.some(x=>x.productId===id||(!x.productId&&x.product===item.name)))throw Error('Este produto possui compras vinculadas. Exclua primeiro as compras, após estornar as aplicações.');
 if(kind==='lot'&&db.applications.some(x=>x.lot===id))throw Error('Esta compra já foi utilizada em aplicações. Exclua primeiro essas aplicações para devolver o estoque.');
 if(kind==='labor'&&db.costs.some(x=>x.laborId===id))throw Error('Este trabalhador possui diárias lançadas. Exclua os custos de mão de obra primeiro.');
 if(kind==='harvest'){const r=summary(db.seasons.find(x=>x.id===item.season));if(r.kg-(+item.kg||0)<r.sold-1e-8)throw Error('Não é possível excluir esta colheita: as vendas excederiam a produção restante. Exclua ou corrija as vendas antes.');}
 const names={area:'a área',season:'a safra',product:'o produto',lot:'a compra',labor:'o cadastro de mão de obra',application:'a aplicação',harvest:'a colheita',sale:'a venda',cost:'o custo'};
 if(!confirm('Excluir '+names[kind]+'? Esta ação não pode ser desfeita. Faça um backup antes de excluir registros importantes.'))return;
 if(kind==='application'){const lot=db.lots.find(x=>x.id===item.lot);if(lot)lot.remaining=Math.min(+lot.qty||Infinity,(+lot.remaining||0)+(+item.qty||0));}
 db[key]=db[key].filter(x=>x.id!==id);save();
}
ROOT.addEventListener('click',e=>{const deletion=e.target.closest('[data-delete]');if(deletion){e.preventDefault();e.stopPropagation();try{removeRecord(deletion.dataset.delete,deletion.dataset.id)}catch(err){alert(err.message)}return}const go=e.target.closest('[data-go]')?.dataset.go,area=e.target.closest('[data-area]')?.dataset.area,tab=e.target.closest('[data-tab]')?.dataset.tab;if(go){if(go==='sair'){localStorage.removeItem(SESSION_KEY);current='';selectedArea='';location.hash='';return render()}if(go==='painel'){selectedArea='';location.hash='';return render()}location.hash=go==='cadastro'?'cadastro':go==='login'?'login':go==='cadastros'?'cadastros':'nova-area';return render()}if(area){selectedArea=area;selectedTab='resumo';location.hash='';return render()}if(tab){selectedTab=tab;return render()}if(e.target.id==='importBackup'){document.getElementById('backupFile')?.click()}if(e.target.id==='backup'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agrogestor-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
ROOT.addEventListener('change',async e=>{if(e.target.id!=='backupFile')return;try{const file=e.target.files?.[0];if(!file)return;const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.areas)||!Array.isArray(data.seasons)||!Array.isArray(data.lots))throw Error('Arquivo não é um backup válido do AgroGestor.');if(!confirm('Substituir todos os dados locais desta conta pelos dados do backup?'))return;db={...empty(),...data};save();alert('Backup importado.')}catch(err){alert('Erro ao importar: '+err.message)}});ROOT.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,d=formData(e);try{if(id==='authForm'){const email=String(d.email||'').trim().toLowerCase();if(!validEmail(email))throw Error('Informe um e-mail válido (use apenas dados fictícios nesta demonstração).');const u=users();if(authMode==='cadastro'){if(!String(d.name||'').trim())throw Error('Informe seu nome.');if(u[email])throw Error('E-mail já cadastrado neste navegador.');const salt=uid();u[email]={name:d.name.trim(),salt,hash:await hashPassword(d.password,salt)};localStorage.setItem(USER_KEY,JSON.stringify(u));authMode='login';location.hash='login';auth();alert('Cadastro de demonstração criado. Agora faça login.');return}if(!u[email]||u[email].hash!==await hashPassword(d.password,u[email].salt))throw Error('E-mail ou senha incorretos.');current=email;localStorage.setItem(SESSION_KEY,email);selectedArea='';location.hash='';return render()}
if(id==='productForm'){const name=d.name.trim();if(!name)throw Error('Informe o produto.');if(db.products.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.packUnit===d.packUnit&&Number(x.packQty||1)===Number(d.packQty)))throw Error('Produto já cadastrado nessa unidade.');if(!Number.isFinite(+d.packQty)||+d.packQty<=0)throw Error('Informe a quantidade por embalagem.');const pu=d.packUnit;const unit=pu==='L'||pu==='ml'?'ml':pu==='kg'||pu==='g'?'g':'un';db.products.push({id:uid(),name,category:d.category,unit,packUnit:pu,packQty:+d.packQty})}
if(id==='laborForm'){if(!d.name.trim()||d.daily===''||!Number.isFinite(+d.daily)||+d.daily<0)throw Error('Informe um valor de diária válido.');db.laborRates.push({id:uid(),name:d.name.trim(),daily:+d.daily})}
if(id==='areaForm'){if(+d.ha<=0)throw Error('Informe uma área positiva.');db.areas.push({id:uid(),name:d.name.trim(),crop:d.crop.trim(),variety:d.variety.trim(),ha:+d.ha,plants:+d.plants||0,rowSpacing:+d.rowSpacing||0,plantSpacing:+d.plantSpacing||0,rootstock:d.rootstock?.trim()||'',plantYear:+d.plantYear||null});selectedArea='';location.hash='';return save()}
if(id==='seasonForm'){if(db.seasons.some(s=>s.area===selectedArea&&s.label===d.label.trim()))throw Error('Safra já cadastrada nesta área.');db.seasons.push({id:uid(),area:selectedArea,label:d.label.trim()})}
if(id==='buyForm'){const product=(db.products||[]).find(x=>x.id===d.productId);if(!product)throw Error('Cadastre o produto em Insumos e mão de obra antes da compra.');if(+d.qty<=0)throw Error('Quantidade inválida.');if(!Number.isFinite(+d.amount)||+d.amount<0)throw Error('Informe o valor total pago.');const pack=packInfo(product);const totalQty=+d.qty*pack.baseQty;db.lots.push({id:uid(),productId:product.id,product:product.name,packages:+d.qty,packUnit:pack.pu,packQty:pack.qty,qty:totalQty,remaining:totalQty,unit:product.unit,amount:+d.amount,unitCost:+d.amount/totalQty,date:d.date||today(),supplier:d.supplier||''})}
if(id==='applyForm'){const lot=db.lots.find(x=>x.id===d.lot);if(!lot||!db.seasons.some(s=>s.id===d.season&&s.area===selectedArea))throw Error('Safra ou lote inválido.');if(+d.qty<=0||+d.qty>lot.remaining+1e-8)throw Error('Quantidade superior ao estoque disponível.');lot.remaining=Math.max(0,lot.remaining-(+d.qty));db.applications.push({id:uid(),season:d.season,lot:lot.id,product:lot.product,unit:lot.unit,qty:+d.qty,amount:+d.qty*lot.unitCost,date:d.date,notes:d.notes})}
if(id==='harvestForm'){if(!d.season||+d.kg<=0)throw Error('Safra ou quantidade inválida.');db.harvests.push({id:uid(),season:d.season,date:d.date,kg:+d.kg})}
if(id==='saleForm'){if(!d.season||+d.kg<=0)throw Error('Safra ou quantidade inválida.');const r=summary(db.seasons.find(s=>s.id===d.season));if(+d.kg>r.remaining+1e-8)throw Error('Quantidade vendida supera o saldo colhido.');db.sales.push({id:uid(),season:d.season,date:d.date,kg:+d.kg,price:+d.price,amount:+d.kg*+d.price})}
if(id==='laborUseForm'){const labor=db.laborRates.find(x=>x.id===d.laborId);if(!labor||!db.seasons.some(x=>x.id===d.season&&x.area===selectedArea)||!d.date||!Number.isFinite(+d.dayFraction)||+d.dayFraction<=0||+d.dayFraction>1)throw Error('Selecione uma safra, data e fração de diária entre 0 e 1.');if(labor.daily==null)throw Error('Este cadastro é antigo e usa custo por hora. Cadastre novamente o trabalhador com o valor da diária.');const allocated=db.costs.filter(x=>x.laborId===labor.id&&x.date===d.date).reduce((n,x)=>n+(+x.dayFraction||0),0);if(allocated+(+d.dayFraction)>1+1e-8)throw Error('A soma das frações desse trabalhador nesta data ultrapassa uma diária. Já alocado: '+num(allocated)+' dia(s).');db.costs.push({id:uid(),season:d.season,description:labor.name+' — '+num(+d.dayFraction)+' diária(s)',category:'Mão de obra',dayFraction:+d.dayFraction,laborId:labor.id,unitCost:labor.daily,amount:+d.dayFraction*labor.daily,date:d.date})}
if(id==='costForm'){if(!d.season||+d.amount<0)throw Error('Dados inválidos.');db.costs.push({id:uid(),season:d.season,description:d.description.trim(),category:d.category,amount:+d.amount})}save()}catch(err){alert(err.message)}});
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));window.addEventListener('hashchange',()=>{if(!current)render()});render();
</script></body></html>
